# Both listeners bind to every interface, not just loopback: the passenger app
# is opened on a phone over the LAN, and the browser there has to reach the
# broker at ws://<laptop-ip>:9001. The Python processes reach 1883 the same way.
# `docker-compose.yml` publishes both ports on 0.0.0.0; if a phone still shows
# Offline, the host firewall is the thing blocking it (allow Docker Desktop /
# port 9001).
listener 1883 0.0.0.0
protocol mqtt
allow_anonymous true

# Browsers can't open raw MQTT/TCP sockets — the digital twin dashboard and the
# passenger app connect here over MQTT-over-WebSockets instead
listener 9001 0.0.0.0
protocol websockets
allow_anonymous true

persistence true
persistence_location /mosquitto/data/
log_dest stdout
